apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

android {
    compileSdk 34

    namespace 'com.nudge.app'
    defaultConfig {
        applicationId 'com.nudge.app'
        minSdkVersion 29
        targetSdkVersion 34
        def vc = (System.getenv("NUDGE_VERSION_CODE") ?: findProperty("NUDGE_VERSION_CODE"))?.toString()
        def vn = (System.getenv("NUDGE_VERSION_NAME") ?: findProperty("NUDGE_VERSION_NAME"))?.toString()
        versionCode vc ? vc.toInteger() : 1
        versionName vn ?: "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Use explicit create() to avoid Groovy DSL quirks in some build environments (e.g. F-Droid buildserver).
        create("release") {
            // Configure via env vars or gradle properties. Do not commit keystores or passwords.
            def storePath = (System.getenv("NUDGE_RELEASE_STORE_FILE") ?: findProperty("NUDGE_RELEASE_STORE_FILE"))?.toString()
            if (storePath) {
                storeFile file(storePath)
                storePassword (System.getenv("NUDGE_RELEASE_STORE_PASSWORD") ?: findProperty("NUDGE_RELEASE_STORE_PASSWORD"))?.toString()
                keyAlias (System.getenv("NUDGE_RELEASE_KEY_ALIAS") ?: findProperty("NUDGE_RELEASE_KEY_ALIAS"))?.toString()
                keyPassword (System.getenv("NUDGE_RELEASE_KEY_PASSWORD") ?: findProperty("NUDGE_RELEASE_KEY_PASSWORD"))?.toString()
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            def releaseConfig = signingConfigs.findByName("release")
            signingConfig = (releaseConfig != null && releaseConfig.storeFile != null) ? releaseConfig : signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    buildFeatures {
        compose true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion = "${rootProject.composeCompilerVersion}"
    }
    
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Kotlin
    implementation("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlinVersion}")
    
    // AndroidX Core
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.activity:activity-compose:1.8.2")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
    
    // Compose
    def composeBom = platform("androidx.compose:compose-bom:${rootProject.composeVersion}")
    implementation composeBom
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    debugImplementation("androidx.compose.ui:ui-tooling")
    
    // Navigation
    implementation("androidx.navigation:navigation-compose:2.7.6")
    
    // Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
}
