apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace 'com.nudge.app'

    compileSdk 34

    defaultConfig {
        applicationId 'com.nudge.app'
        minSdk 24
        targetSdk 34

        def vc = (System.getenv("NUDGE_VERSION_CODE") ?: findProperty("NUDGE_VERSION_CODE"))?.toString()
        def vn = (System.getenv("NUDGE_VERSION_NAME") ?: findProperty("NUDGE_VERSION_NAME"))?.toString()
        versionCode vc ? vc.toInteger() : 1
        versionName vn ?: "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Use explicit create() to avoid Groovy DSL quirks in some build environments (e.g. F-Droid buildserver).
        create("release") {
            // Configure via env vars or gradle properties. Do not commit keystores or passwords.
            def storePath = (System.getenv("NUDGE_RELEASE_STORE_FILE") ?: findProperty("NUDGE_RELEASE_STORE_FILE"))?.toString()
            if (storePath) {
                storeFile file(storePath)
                storePassword (System.getenv("NUDGE_RELEASE_STORE_PASSWORD") ?: findProperty("NUDGE_RELEASE_STORE_PASSWORD"))?.toString()
                keyAlias (System.getenv("NUDGE_RELEASE_KEY_ALIAS") ?: findProperty("NUDGE_RELEASE_KEY_ALIAS"))?.toString()
                keyPassword (System.getenv("NUDGE_RELEASE_KEY_PASSWORD") ?: findProperty("NUDGE_RELEASE_KEY_PASSWORD"))?.toString()
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            def releaseConfig = signingConfigs.findByName("release")
            signingConfig = (releaseConfig != null && releaseConfig.storeFile != null) ? releaseConfig : signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.constraintlayout:constraintlayout:2.2.0")
    implementation("androidx.activity:activity-ktx:1.9.3")
}
