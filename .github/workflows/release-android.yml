name: Release Android (APK + AAB)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - uses: android-actions/setup-android@v3

      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Decode release keystore
        run: |
          echo "${{ secrets.NUDGE_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/nudge-release.jks

      - name: Compute version
        shell: bash
        run: |
          # Tags are like v1.0.16; Play/Gradle versionName should be 1.0.16
          REF_NAME="${GITHUB_REF_NAME:-0.0.0}"
          VERSION_NAME="${REF_NAME#v}"
          echo "NUDGE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "NUDGE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        env:
          # Signing
          NUDGE_RELEASE_STORE_FILE: ${{ github.workspace }}/android/nudge-release.jks
          NUDGE_RELEASE_STORE_PASSWORD: ${{ secrets.NUDGE_RELEASE_STORE_PASSWORD }}
          NUDGE_RELEASE_KEY_ALIAS: ${{ secrets.NUDGE_RELEASE_KEY_ALIAS }}
          NUDGE_RELEASE_KEY_PASSWORD: ${{ secrets.NUDGE_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/
          cp android/app/build/outputs/bundle/release/app-release.aab dist/
          (cd dist && shasum -a 256 app-release.apk app-release.aab > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-release.aab
            dist/SHA256SUMS.txt


