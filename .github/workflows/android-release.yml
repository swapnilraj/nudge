name: Android Release (APK + AAB)

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm ci

      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Decode release keystore
        if: ${{ secrets.NUDGE_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.NUDGE_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/nudge-release.jks

      - name: Build APK + AAB
        env:
          # Versioning
          NUDGE_VERSION_CODE: ${{ github.run_number }}
          NUDGE_VERSION_NAME: ${{ github.ref_name }}
          # Signing
          NUDGE_RELEASE_STORE_FILE: ${{ github.workspace }}/android/nudge-release.jks
          NUDGE_RELEASE_STORE_PASSWORD: ${{ secrets.NUDGE_RELEASE_STORE_PASSWORD }}
          NUDGE_RELEASE_KEY_ALIAS: ${{ secrets.NUDGE_RELEASE_KEY_ALIAS }}
          NUDGE_RELEASE_KEY_PASSWORD: ${{ secrets.NUDGE_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/
          cp android/app/build/outputs/bundle/release/app-release.aab dist/
          (cd dist && shasum -a 256 app-release.apk app-release.aab > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-release.aab
            dist/SHA256SUMS.txt


